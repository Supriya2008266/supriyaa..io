<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResolveAI – AI Customer Support Ticket Management</title>
  <meta name="description" content="ResolveAI helps small sellers triage support tickets, check fault, and release capped, owner-approved rewards. Frontend demo with simulated AI." />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e3a8a'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    (function () {
      try {
        var t = localStorage.getItem('resolveai-theme');
        if (!t) {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">ResolveAI needs JavaScript enabled to run.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
